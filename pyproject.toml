[project]
name = "termflix"
version = "0.1.0"
description = "Play videos and images in your terminal"
authors = [
    {name = "Ahmad Sohaib Qasim", email = "qasim.datadev@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11, <4.0"
license = "MIT"
keywords = ["terminal", "ascii", "video", "cli"]
dependencies = ["textual (>=8.2.7,<9.0.0)", "rich (>=15.0.0,<16.0.0)", "opencv-python (>=4.13.0.92,<5.0.0.0)", "pillow (>=12.2.0,<13.0.0)", "numpy (>=2.4.6,<3.0.0)", "click (>=8.4.1,<9.0.0)"]

[project.urls]
Homepage = "https://github.com/asqasim/termflix"
Repository = "https://github.com/asqasim/termflix"

[project.scripts]
termflix = "termflix.main:main"

[tool.poetry]
packages = [{include = "termflix", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-cov = "^6.0"
ruff = "^0.15"
pre-commit = "^4.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that take long",
    "windows_only: windows specific tests",
    "linux_only: linux specific tests",
]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.coverage.report]
fail_under = 80